[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eegbci"
version = "0.1.0"
description = "Leakage-free EEG decoding of Idle / Push / Walk motor intent, with a causal real-time (LSL) brain-switch decoder. Master's Final Studies Project (PFE)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Hannoun Amine Amar" }]
requires-python = ">=3.10"
keywords = ["EEG", "brain-computer-interface", "BCI", "Riemannian-geometry", "deep-learning", "lab-streaming-layer"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "mne>=1.5",
  "pyriemann>=0.5",
  "joblib>=1.3",
  "matplotlib>=3.7",
  "torch>=2.0",
]

[project.optional-dependencies]
realtime = ["pylsl>=1.16"]
dev = ["pytest>=7.4"]
legacy = ["optuna>=3.0", "seaborn>=0.12", "plotly>=5.0", "jupyter"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eegbci = ["assets/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
